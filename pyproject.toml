[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfdsim"
version = "0.3.0"
description = "Command-line chemical process simulator for text-based flowsheets"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "scipy>=1.18",
    "numba>=0.67",
    "pypdf>=6.16",
    "CoolProp>=7.2,<8.0",
    "rdkit>=2026.3",
    "py2opsin>=1.2",
    "chemicals>=1.5",
]

[project.optional-dependencies]
render = [
    "CairoSVG>=2.7",
]
web = [
    "Flask>=3.1",
    "Werkzeug>=3.1",
    "Gunicorn>=26.2",
]
dipole-xtb = [
    "tblite[ase]>=0.7",
]
dipole-pvdz = [
    "tblite[ase]>=0.7",
    "pyscf>=2.14",
]

[project.scripts]
pfdsim = "pfdsim.cli:main"

[dependency-groups]
dev = [
    "iapws>=1.5.5",
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
]

[tool.uv]
package = true

[tool.ruff]
extend-exclude = ["data/archived"]

[tool.ruff.lint]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"property_resolution/base.py" = ["F403", "F405"]
"property_resolution/critical.py" = ["F403", "F405"]
"property_resolution/formation.py" = ["F403", "F405"]
"property_resolution/heat_capacity.py" = ["F403", "F405"]
"property_resolution/identity.py" = ["F403", "F405"]
"property_resolution/liquid_volume.py" = ["F403", "F405"]
"property_resolution/phase_change.py" = ["F403", "F405"]
"property_resolution/surface_tension.py" = ["F403", "F405"]
"property_resolution/vapor_pressure.py" = ["F403", "F405"]
"property_resolution/viscosity.py" = ["F403", "F405"]
"scripts/**/*.py" = ["E402", "E701", "E702"]
"tests/**/*.py" = ["E402"]
"thermodynamics.py" = ["F403"]

[tool.setuptools]
packages = ["pfdsim", "pfdsim.property_resolution", "pfdsim.thermodynamics_models"]
package-dir = {pfdsim = "."}

[tool.setuptools.package-data]
pfdsim = [
    "data/*.json",
    "data/*.sqlite",
    "data/*.txt",
    "data/*.xlsx",
    "data/unifac2/*.csv",
    "data/unifac2/*.xlsx",
    "data/psrk/*.json",
    "examples/*.pfd",
    "examples/*.pfr",
    "static/js/*.js",
    "templates/*.html",
]
