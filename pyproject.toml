[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfdsim"
version = "0.2.0.dev3"
description = "Command-line chemical process simulator for text-based flowsheets"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "openpyxl>=3.1",
    "scipy>=1.18",
    "numba>=0.67",
    "pypdf>=6.16",
    "CoolProp>=7.2,<8.0",
    "rdkit>=2026.3",
    "py2opsin>=1.2",
    "chemicals>=1.5",
]

[project.optional-dependencies]
web = [
    "Flask>=3.1",
    "Werkzeug>=3.1",
    "Gunicorn>=26.2",
]

[project.scripts]
pfdsim = "pfdsim.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "ruff>=0.16",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["pfdsim", "pfdsim.property_resolution", "pfdsim.thermodynamics_models"]
package-dir = {pfdsim = "."}

[tool.setuptools.package-data]
pfdsim = [
    "data/*.json",
    "data/*.sqlite",
    "data/*.txt",
    "data/*.xlsx",
    "data/unifac2/*.csv",
    "data/unifac2/*.xlsx",
    "data/psrk/*.json",
    "examples/*.pfd",
    "examples/*.pfr",
    "static/js/*.js",
    "templates/*.html",
]
